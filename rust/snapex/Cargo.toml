[package]
name = "snapex"
version = "0.1.0"
description = "SnapEx64.dll: lets a window grow beyond the screen for the extended window capture"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "SnapEx64"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemServices"]
