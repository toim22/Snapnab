[package]
name = "snapedit"
version.workspace = true
description = "SnapnabEditor.exe, the image and video editor, in egui on top of snapcore and snapui"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "snapedit_app"
path = "src/lib.rs"

[[bin]]
name = "SnapnabEditor"
path = "src/main.rs"

[dependencies]
egui = "0.37"
snapcore = { path = "../snapcore" }
snapui = { path = "../snapui" }
regex = "1.13.1"
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[build-dependencies]
embed-resource = "3.0.12"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Time",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
